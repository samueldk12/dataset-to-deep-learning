services:
  # Python OpenCV & yt-dlp Video Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: annotatex-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server:/app
      - temp_videos:/tmp/annotatex_videos
    networks:
      - annotatex-net

  # React / Vite SPA Frontend with Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annotatex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - annotatex-net

volumes:
  temp_videos:

networks:
  annotatex-net:
    driver: bridge
